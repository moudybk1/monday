# One command brings up the backend:  docker compose -f infra/docker-compose.yml up -d --build
# The web app deploys to Vercel with API_URL and NEXT_PUBLIC_WS_URL pointing here.
services:
  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_PATH: /data/monday.sqlite
    volumes:
      - monday-data:/data
    restart: always
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  monday-data:
  caddy-data:
