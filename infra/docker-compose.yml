# Monday on one machine: API and agents, the Perpl stats process, the web app, and Caddy for TLS on DOMAIN and
# analytics.DOMAIN (point both at this machine).
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build      (from the repo root)
# DOMAIN in .env must point at this machine. Never run a second Monday (a laptop, say) on the same Perpl accounts.
services:
  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    volumes:
      - ../apps/server/data:/app/apps/server/data # the account database and the stats database, kept across rebuilds
    restart: always
    stop_grace_period: 20s # on SIGTERM the server cancels resting orders before it exits (10 s at most)
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Public Perpl stats: the indexer and the /api/stats API in their own process, so heavy analytics never stalls trading.
  stats:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["npx", "tsx", "src/stats/run.ts"]
    env_file: ../.env
    volumes:
      - ../apps/server/data:/app/apps/server/data
    restart: always
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/stats/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NETWORK: ${NETWORK:-mainnet}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN:?set DOMAIN in .env}/ws
        NEXT_PUBLIC_MONAD_RPC_URL: ${NEXT_PUBLIC_MONAD_RPC_URL:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    environment:
      API_URL: http://server:3001
    restart: always
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
